<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Vernatun">
  <title>Vernatun</title>
  <!-- Dark-luxury mark: terracotta ember + sun-gold accent -->
  <defs>
    <linearGradient id="v-ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25E28"/>
      <stop offset="100%" stop-color="#E6B25A"/>
    </linearGradient>
  </defs>
  <!-- Geometric V mark -->
  <g transform="translate(8,12)">
    <path
      d="M36 4 L52 68 L68 4"
      fill="none"
      stroke="url(#v-ember)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="52" cy="72" r="4" fill="#E6B25A"/>
  </g>
  <!-- Wordmark -->
  <text
    x="96"
    y="58"
    font-family="Century Gothic, Plus Jakarta Sans, system-ui, sans-serif"
    font-size="36"
    font-weight="700"
    letter-spacing="-0.04em"
    fill="#E2E2E6"
  >Vernatun</text>
  <text
    x="98"
    y="78"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="9"
    font-weight="500"
    letter-spacing="0.22em"
    fill="#A48C81"
  >ATELIER</text>
</svg>
