name: Growth VPS read-only connectivity
on:
  push:
    branches: [codex/director-chatgpt-transfer]
    paths: [.github/ops/growth-vps-connectivity.json]
permissions:
  contents: read
concurrency:
  group: growth-vps-connectivity
  cancel-in-progress: false
jobs:
  connectivity:
    if: github.ref == 'refs/heads/codex/director-chatgpt-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only DNS, TCP and public HTTPS probes
        env:
          VPS_HOST: ${{ secrets.INFINITYS_DOOR_VPS_HOST }}
          VPS_PORT: ${{ secrets.INFINITYS_DOOR_VPS_PORT }}
        run: node scripts/growth-vps-connectivity.mjs
