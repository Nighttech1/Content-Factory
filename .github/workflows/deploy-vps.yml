name: Deploy content.vernatunspeakclub.com

# Робот GitHub (у него SSH открыт) собирает приложение на раннере и выкладывает на VPS.
# Из облака Claude SSH закрыт (порт 22), поэтому деплой идёт здесь.
# ВАЖНО: цель — content.vernatunspeakclub.com (НЕ admin — там личный кабинет владельца).
# Запуск ТОЛЬКО вручную (workflow_dispatch), чтобы не трогать сервер без надобности.
# Требуется: A-запись content.vernatunspeakclub.com -> IP нашего VPS (для SSL).
# Секреты: INFINITYS_DOOR_VPS_HOST/USER/SSH_KEY (+ опц. _PORT, по умолч. 22).

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build (standalone)
        working-directory: веб
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -e
          npm ci
          npm run build
          test -d .next/standalone || { echo "::error::.next/standalone не создан — standalone-сборка не удалась"; exit 1; }

      - name: Package bundle
        working-directory: веб
        run: |
          set -e
          rm -rf ../deploy && mkdir -p ../deploy/app
          cp -r .next/standalone/. ../deploy/app/
          mkdir -p ../deploy/app/.next
          cp -r .next/static ../deploy/app/.next/static
          if [ -d public ]; then cp -r public ../deploy/app/public; fi
          test -f ../deploy/app/server.js || { echo "::error::server.js не найден в standalone"; ls -la ../deploy/app; exit 1; }
          tar -C ../deploy/app -czf ../deploy/app.tar.gz .
          echo "bundle size:"; du -h ../deploy/app.tar.gz

      - name: Preflight — форма host-секрета (без раскрытия значения) + авто-trim
        env:
          RAW_HOST: ${{ secrets.INFINITYS_DOOR_VPS_HOST }}
        run: |
          HT="$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')"
          echo "длина: raw=$(printf '%s' "$RAW_HOST" | wc -c) после_trim=$(printf '%s' "$HT" | wc -c)"
          echo "точек(.)=$(printf '%s' "$HT" | tr -cd '.' | wc -c)  двоеточий(:)=$(printf '%s' "$HT" | tr -cd ':' | wc -c)"
          if [ -z "$HT" ]; then
            echo "::error::Секрет INFINITYS_DOOR_VPS_HOST пустой"; exit 1
          elif printf '%s' "$HT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "форма: IPv4 ✓"
          elif printf '%s' "$HT" | grep -q ':'; then
            echo "форма: похоже на IPv6 (есть двоеточия)"
          else
            echo "::warning::форма host не IPv4 и не IPv6 — вероятно домен без DNS или лишние символы"
          fi
          echo "VPS_HOST_CLEAN=$HT" >> "$GITHUB_ENV"

      - name: Recon VPS (проверка связи)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST_CLEAN }}
          username: ${{ secrets.INFINITYS_DOOR_VPS_USER }}
          key: ${{ secrets.INFINITYS_DOOR_VPS_SSH_KEY }}
          port: ${{ secrets.INFINITYS_DOOR_VPS_PORT || 22 }}
          command_timeout: "3m"
          script: |
            echo "=== connected ==="
            uname -a || true
            cat /etc/os-release 2>/dev/null | head -2 || true
            echo "node: $(command -v node && node -v || echo none)"
            echo "nginx: $(command -v nginx || echo none)"
            echo "pm2: $(command -v pm2 || echo none)"
            echo "whoami: $(whoami)"

      - name: Copy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST_CLEAN }}
          username: ${{ secrets.INFINITYS_DOOR_VPS_USER }}
          key: ${{ secrets.INFINITYS_DOOR_VPS_SSH_KEY }}
          port: ${{ secrets.INFINITYS_DOOR_VPS_PORT || 22 }}
          source: "deploy/app.tar.gz"
          target: "/tmp/cf-deploy"
          overwrite: true

      - name: Provision & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST_CLEAN }}
          username: ${{ secrets.INFINITYS_DOOR_VPS_USER }}
          key: ${{ secrets.INFINITYS_DOOR_VPS_SSH_KEY }}
          port: ${{ secrets.INFINITYS_DOOR_VPS_PORT || 22 }}
          command_timeout: "25m"
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            DOMAIN="content.vernatunspeakclub.com"
            APP_PORT="8088"   # внутренний непривилегированный порт (наружу отдаёт nginx на 443). 88 <1024 требует root — не используем.
            APP_DIR="/opt/content-factory"
            EMAIL="admin@vernatunspeakclub.com"
            ME="$(id -un)"; GRP="$(id -gn)"

            # root или sudo? (не-root пользователю нужен passwordless sudo)
            if [ "$(id -u)" = "0" ]; then
              SUDO=""
            elif sudo -n true 2>/dev/null; then
              SUDO="sudo -n"
            else
              echo "::error::Пользователь $ME не root и без passwordless-sudo. Дай ему sudo без пароля ИЛИ поставь секрет INFINITYS_DOOR_VPS_USER=root."
              exit 1
            fi
            echo "user=$ME sudo='${SUDO:-none(root)}'"

            echo "=== deps ==="
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | $SUDO -E bash -
              $SUDO apt-get install -y nodejs
            fi
            if ! command -v pm2 >/dev/null 2>&1; then $SUDO npm install -g pm2; fi
            if ! command -v nginx >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1; then
              $SUDO apt-get update -y
              $SUDO apt-get install -y nginx certbot python3-certbot-nginx
            fi

            echo "=== deploy files ==="
            TB="$(find /tmp/cf-deploy -name 'app.tar.gz' | head -1)"
            test -n "$TB" || { echo "tarball not found"; exit 1; }
            $SUDO mkdir -p "$APP_DIR"
            $SUDO rm -rf "$APP_DIR"/* "$APP_DIR"/.next 2>/dev/null || true
            $SUDO tar -C "$APP_DIR" -xzf "$TB"
            $SUDO chown -R "$ME":"$GRP" "$APP_DIR"
            test -f "$APP_DIR/server.js" || { echo "server.js missing after extract"; ls -la "$APP_DIR"; exit 1; }

            echo "=== app (pm2) on :$APP_PORT ==="
            cd "$APP_DIR"
            export PORT="$APP_PORT" HOSTNAME="0.0.0.0" NODE_ENV="production"
            pm2 delete content-factory 2>/dev/null || true
            pm2 start server.js --name content-factory --update-env
            pm2 save || true
            # автозапуск после ребута (best-effort)
            $SUDO env PATH=$PATH pm2 startup systemd -u "$ME" --hp "$HOME" >/dev/null 2>&1 || true

            echo "=== nginx vhost ==="
            cat <<NGINX | $SUDO tee /etc/nginx/sites-available/content-factory >/dev/null
            server {
                listen 80;
                listen [::]:80;
                server_name $DOMAIN;
                client_max_body_size 50m;
                location / {
                    proxy_pass http://127.0.0.1:$APP_PORT;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
            }
            NGINX
            $SUDO ln -sf /etc/nginx/sites-available/content-factory /etc/nginx/sites-enabled/content-factory
            $SUDO rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            $SUDO nginx -t && $SUDO systemctl reload nginx

            echo "=== firewall (best-effort) ==="
            if command -v ufw >/dev/null 2>&1 && $SUDO ufw status | grep -q "Status: active"; then
              $SUDO ufw allow 80/tcp || true; $SUDO ufw allow 443/tcp || true; $SUDO ufw allow ${APP_PORT}/tcp || true
            fi

            echo "=== SSL (certbot, best-effort — нужна A-запись $DOMAIN -> этот сервер и открытый 80) ==="
            if $SUDO certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos -m "$EMAIL" --redirect; then
              echo "SSL_OK"
            else
              echo "::warning::CERTBOT не прошёл. Проверь DNS A-запись $DOMAIN -> IP сервера и доступность 80 порта, затем перезапусти workflow. Пока доступно по http://$DOMAIN"
            fi
            $SUDO systemctl reload nginx || true

            echo "=== health ==="
            sleep 5
            curl -s -o /dev/null -w "local :$APP_PORT -> %{http_code}\n" "http://127.0.0.1:$APP_PORT/studio" || true
            pm2 list || true
            echo "=== node on VPS ==="; node -v || true
            echo "=== server.js head ==="; head -3 "$APP_DIR/server.js" 2>/dev/null || true
            echo "=== pm2 crash logs (tail) ==="
            pm2 logs content-factory --lines 60 --nostream 2>&1 | tail -70 || true
            echo "DEPLOY_DONE"
