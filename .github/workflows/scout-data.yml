name: Scout data (manual)
run-name: Scout ${{ inputs.mode }} · ${{ inputs.report_id || 'readiness' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check checks secret presence only; collection needs explicit authorization'
        type: choice
        options: [check, youtube, instagram, tiktok]
        default: check
      report_id:
        description: 'Collection report ID: S-YYYYMM-GEN-01 (or CAR/REL/ART/YTB)'
        type: string
      handles:
        description: 'Comma-separated public handles; Instagram always includes mosarmclub'
        type: string
        default: mosarmclub
      limit:
        description: 'Apify: 1–6 each, IG max 7 profiles / TikTok max 5; YouTube 1–12; max 50 total'
        type: string
        default: '5'
      authorization:
        description: 'After owner authorizes research: COLLECT <report_id>. Empty for check.'
        type: string
      apify_budget_usd:
        description: 'Apify hard cap per platform, USD (0.01–0.50); research total max 1.00; monthly max 5.00'
        type: string
        default: '0.50'

permissions:
  contents: read

concurrency:
  group: scout-manual-provider-budget
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check or collect
        env:
          SCOUT_MODE: ${{ inputs.mode }}
          SCOUT_REPORT_ID: ${{ inputs.report_id }}
          SCOUT_HANDLES: ${{ inputs.handles }}
          SCOUT_LIMIT: ${{ inputs.limit }}
          SCOUT_AUTHORIZATION: ${{ inputs.authorization }}
          SCOUT_APIFY_BUDGET_USD: ${{ inputs.apify_budget_usd }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: python3 shared/skills/scout-actions/collect.py
      - name: Save snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scout-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/scout-actions-result/*.json
          if-no-files-found: error
          retention-days: 30
