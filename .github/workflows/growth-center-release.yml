name: Growth center QA and release
on:
  push:
    branches: [codex/director-chatgpt-transfer]
    paths:
      - .github/releases/growth-center-qa.json
      - .github/releases/growth-center-release.json
permissions:
  contents: read
  actions: read
concurrency:
  group: growth-center-release
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      source: ${{ steps.gate.outputs.source }}
      run: ${{ steps.gate.outputs.run }}
      artifact: ${{ steps.gate.outputs.artifact }}
      qaCommit: ${{ steps.gate.outputs.qaCommit }}
      trustArtifact: ${{ steps.gate.outputs.trustArtifact }}
      trustRun: ${{ steps.gate.outputs.trustRun }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: mode
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "$BEFORE^{commit}"
          QA=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- .github/releases/growth-center-qa.json)
          RELEASE=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- .github/releases/growth-center-release.json)
          if [[ -n "$QA" && -z "$RELEASE" ]]; then echo 'mode=qa' >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE" && -z "$QA" ]]; then echo 'mode=deploy' >> "$GITHUB_OUTPUT"
          else echo 'Exactly one marker must change'; exit 1; fi
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: node scripts/growth-center-gate.mjs "$MODE"
  qa:
    needs: gate
    if: needs.gate.outputs.mode == 'qa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: веб/package-lock.json
      - name: Clean install, typecheck, guards and standalone build
        working-directory: веб
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          npx tsx scripts/test-growth-center.ts
          node --import tsx memory/waves/W-2026-11-10-situation-center/tester-contract-boundaries.mjs
          node --import tsx scripts/test-growth-workspace.ts
          node --import tsx scripts/test-growth-workspace-api.ts
          node --import tsx scripts/test-growth-workspace-boundaries.ts
          node --import tsx scripts/test-growth-prepared.ts
          node --import tsx scripts/test-growth-prepared-boundaries.ts
          node ../scripts/test-growth-prepared-keyboard-state.mjs
          npm run build
          test -f .next/standalone/server.js
          npx playwright install --with-deps chromium
      - name: Package standalone build for production QA
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle/app
          cp -a веб/.next/standalone/. release-bundle/app/
          mkdir -p release-bundle/app/.next
          cp -a веб/.next/static release-bundle/app/.next/static
          cp -a веб/public release-bundle/app/public
          tar -C release-bundle/app -czf release-bundle/app.tar.gz .
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const revision=JSON.parse(fs.readFileSync('веб/data/growth/vernatun.json')).revision;
          const metadata={sourceSha:process.env.SOURCE_SHA,runId:process.env.GITHUB_RUN_ID,qaCommitSha:process.env.GITHUB_SHA,revision,bundleSha256:crypto.createHash('sha256').update(fs.readFileSync('release-bundle/app.tar.gz')).digest('hex')};
          fs.writeFileSync('release-bundle/release-metadata.json',JSON.stringify(metadata));
          NODE
      - name: Growth workspace HTTPS production-bundle QA
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.source }}
        run: |
          set -euo pipefail
          QA_ROOT="$PWD"
          command -v openssl >/dev/null
          # Runtime-only fixture configuration: generated AFTER the immutable bundle was packaged.
          GROWTH_ADMIN_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          printf '%s\n' "::add-mask::$GROWTH_ADMIN_SECRET"
          export GROWTH_ADMIN_SECRET
          export GROWTH_ALLOWED_ORIGIN=https://localhost:3443
          export QA_WORKSPACE_ORIGIN=https://localhost:3443
          export QA_WORKSPACE_UPSTREAM=http://127.0.0.1:3000
          GROWTH_WORKSPACE_DATA_DIR="$(mktemp -d "$RUNNER_TEMP/growth-workspace-$GITHUB_RUN_ID.XXXXXX")"
          export GROWTH_WORKSPACE_DATA_DIR
          export GROWTH_WORKSPACE_SCHEDULER=1
          export NODE_ENV=production
          unset GROWTH_GITHUB_TOKEN GROWTH_GITHUB_REPOSITORY GROWTH_GITHUB_BRANCH GROWTH_SCOUT_BRANCH
          # Synthetic history only in the private runtime fixture, never the packaged artifact.
          (cd веб && node --import tsx scripts/seed-growth-workspace-qa.ts)
          (cd веб && node --import tsx scripts/seed-growth-prepared-qa.ts)
          cleanup(){
            local code=$?
            kill "$SERVER_PID" 2>/dev/null || true
            # Logs are the only uploaded runtime file; never upload private state or TLS material.
            node -e 'const fs=require("node:fs");const file=process.argv[1];if(fs.existsSync(file)){fs.writeFileSync(file,fs.readFileSync(file,"utf8").replaceAll(process.env.GROWTH_ADMIN_SECRET,"[REDACTED QA SECRET]"))}' "$QA_ROOT/qa-server.log" || rm -f "$QA_ROOT/qa-server.log"
            exit "$code"
          }
          cd release-bundle/app
          PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../qa-server.log 2>&1 &
          SERVER_PID=$!
          trap cleanup EXIT
          cd ../..
          for n in $(seq 1 45); do if curl --fail --silent http://127.0.0.1:3000/growth > /dev/null; then break; fi; test "$n" -lt 45; sleep 2; done
          node scripts/growth-prepared-browser-qa.mjs
          node scripts/growth-prepared-client-qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: growth-center-qa-${{ github.run_id }}
          path: |
            release-bundle/app.tar.gz
            release-bundle/release-metadata.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: growth-center-evidence-${{ github.run_id }}
          path: |
            qa-evidence/
            qa-server.log
          retention-days: 14
  deploy:
    needs: gate
    if: needs.gate.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Operations adapter comes from this release commit; app remains the verified QA artifact.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact }}
          run-id: ${{ needs.gate.outputs.run }}
          github-token: ${{ github.token }}
          path: verified-artifact
          merge-multiple: true
      - name: Verify tested artifact identity
        id: bundle
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.source }}
          QA_RUN: ${{ needs.gate.outputs.run }}
          QA_COMMIT: ${{ needs.gate.outputs.qaCommit }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const m=JSON.parse(fs.readFileSync('verified-artifact/release-metadata.json'));
          const hash=crypto.createHash('sha256').update(fs.readFileSync('verified-artifact/app.tar.gz')).digest('hex');
          if(m.sourceSha!==process.env.SOURCE_SHA||String(m.runId)!==process.env.QA_RUN||m.qaCommitSha!==process.env.QA_COMMIT||hash!==m.bundleSha256||!/^[A-Za-z0-9._-]+$/.test(m.revision))throw Error('Artifact identity mismatch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`revision=${m.revision}\n`);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.gate.outputs.trustArtifact != ''
        with:
          artifact-ids: ${{ needs.gate.outputs.trustArtifact }}
          run-id: ${{ needs.gate.outputs.trustRun }}
          github-token: ${{ github.token }}
          path: previous-ssh-trust
          merge-multiple: true
      - name: SSH release with preserved data and rollback
        env:
          # Exact owner-authorized domain; secret HOST was unreachable in read-only diagnostics.
          VPS_HOST: content.vernatunspeakclub.com
          VPS_USER: ${{ secrets.INFINITYS_DOOR_VPS_USER }}
          VPS_KEY: ${{ secrets.INFINITYS_DOOR_VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.INFINITYS_DOOR_VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.INFINITYS_DOOR_VPS_KNOWN_HOSTS }}
          SOURCE_SHA: ${{ needs.gate.outputs.source }}
          REVISION: ${{ steps.bundle.outputs.revision }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/growth_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/growth_known_hosts
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -s ~/.ssh/growth_key
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.:_-]+$ && "$VPS_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          PORT="${VPS_PORT:-22}"; [[ "$PORT" =~ ^[0-9]+$ ]]
          TRUST=accept-new
          if [[ -n "$VPS_KNOWN_HOSTS" ]]; then TRUST=yes
          elif test -s previous-ssh-trust/known_hosts; then cp previous-ssh-trust/known_hosts ~/.ssh/growth_known_hosts; TRUST=yes
          else echo 'Host trust: first-connection TOFU; known_hosts retained as artifact'; fi
          OPTS=(-i ~/.ssh/growth_key -o BatchMode=yes -o IdentitiesOnly=yes -o HashKnownHosts=yes -o StrictHostKeyChecking="$TRUST" -o UserKnownHostsFile=~/.ssh/growth_known_hosts -o ConnectTimeout=20)
          # Read-only capacity gate before remote staging, SCP, backup or process stop.
          # gzip ISIZE is exact for this single-member bundle (<4 GiB uncompressed).
          RELEASE_BYTES="$(gzip -l -- verified-artifact/app.tar.gz | awk 'NR==2 {print $2}')"
          [[ "$RELEASE_BYTES" =~ ^[0-9]+$ && "$RELEASE_BYTES" -gt 0 && "$RELEASE_BYTES" -lt 4294967296 ]]
          ssh "${OPTS[@]}" -p "$PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '$RELEASE_BYTES'" <<'DISK_PREFLIGHT'
          set -euo pipefail
          RELEASE_BYTES="$1"
          BASE=/opt/content-factory
          OLD_RELEASE="$(readlink -f "$BASE/current")"
          [[ "$OLD_RELEASE" = "$BASE/releases/"* && -d "$OLD_RELEASE" ]]
          if ! OLD_BYTES="$(du -sb "$OLD_RELEASE" 2>/dev/null | awk '{print $1}')"; then
            echo 'DISK_PREFLIGHT_FAILED: unable to assess old release capacity'; exit 1
          fi
          if ! RUNTIME_BYTES="$(du -sb /var/lib/content-factory 2>/dev/null | awk '{print $1}')"; then
            echo 'DISK_PREFLIGHT_FAILED: unable to assess capacity'; exit 1
          fi
          if ! AVAILABLE="$(df -PB1 "$BASE" 2>/dev/null | awk 'NR==2 {print $4}')"; then
            echo 'DISK_PREFLIGHT_FAILED: unable to assess capacity'; exit 1
          fi
          if ! [[ "$OLD_BYTES" =~ ^[0-9]+$ && "$RUNTIME_BYTES" =~ ^[0-9]+$ && "$AVAILABLE" =~ ^[0-9]+$ ]]; then
            echo 'DISK_PREFLIGHT_FAILED: unable to assess capacity'; exit 1
          fi
          REQUIRED=$((2 * (OLD_BYTES + RUNTIME_BYTES) + RELEASE_BYTES + 268435456))
          if [[ "$AVAILABLE" -lt "$REQUIRED" ]]; then
            echo 'DISK_PREFLIGHT_FAILED: insufficient free space; no release staged'; exit 1
          fi
          echo 'DISK_PREFLIGHT_OK'
          DISK_PREFLIGHT
          REMOTE="/tmp/growth-center-$SOURCE_SHA"
          ssh "${OPTS[@]}" -p "$PORT" "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p '$REMOTE'"
          scp "${OPTS[@]}" -P "$PORT" verified-artifact/app.tar.gz scripts/deploy-growth-center.sh "$VPS_USER@$VPS_HOST:$REMOTE/"
          ssh "${OPTS[@]}" -p "$PORT" "$VPS_USER@$VPS_HOST" "bash '$REMOTE/deploy-growth-center.sh' '$SOURCE_SHA' '$REMOTE/app.tar.gz' '$REVISION'"
      - name: Retain host trust record
        if: always()
        run: |
          mkdir -p ssh-trust
          if test -s ~/.ssh/growth_known_hosts; then
            cp ~/.ssh/growth_known_hosts ssh-trust/known_hosts
            ssh-keygen -H -f ssh-trust/known_hosts >/dev/null 2>&1
            rm -f ssh-trust/known_hosts.old
          fi
          rm -f ~/.ssh/growth_key
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: growth-center-host-trust-${{ github.run_id }}
          path: ssh-trust/known_hosts
          if-no-files-found: ignore
          retention-days: 90
